<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Runner 🏃 | Sanan's World</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃</text></svg>">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a15;
    font-family: 'Poppins', Arial, sans-serif;
    color: #fff;
    user-select: none;
  }

  #gameWrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050510;
  }

  #gameCanvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    background: #87ceeb;
    box-shadow: 0 0 60px rgba(100, 150, 255, 0.15);
    border-radius: 8px;
  }

  #hud {
    position: fixed;
    top: 20px;
    left: 0;
    right: 0;
    padding: 0 30px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }

  .hud-box {
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 14px;
    padding: 10px 18px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    min-width: 100px;
    text-align: center;
  }

  .hud-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: #a0b0d0;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .hud-value {
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(120, 180, 255, 0.5);
  }

  #hudRight {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }

  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5, 5, 20, 0.85);
    backdrop-filter: blur(12px);
    z-index: 20;
    text-align: center;
    padding: 20px;
    transition: opacity 0.4s ease;
  }

  #overlay.hidden { display: none; }

  .ov-badge {
    display: inline-block;
    padding: 6px 18px;
    border: 1px solid rgba(120, 180, 255, 0.5);
    border-radius: 30px;
    color: #a8c8ff;
    font-size: 11px;
    letter-spacing: 3px;
    font-weight: 700;
    margin-bottom: 20px;
    background: rgba(120, 180, 255, 0.08);
  }

  .ov-title {
    font-size: clamp(36px, 7vw, 72px);
    font-weight: 900;
    line-height: 1.1;
    background: linear-gradient(120deg, #ffffff, #a8c8ff, #6a8eff, #ffffff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 2px;
    margin-bottom: 12px;
    animation: titleFlow 4s linear infinite;
  }

  @keyframes titleFlow {
    to { background-position: 300% 0; }
  }

  .ov-subtitle {
    color: #b0c0d8;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 30px;
    max-width: 400px;
    line-height: 1.7;
  }

  .ov-keys {
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .key-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    font-size: 12px;
    color: #d0e0f8;
    font-weight: 600;
  }

  .key-chip .kc-key {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(120, 180, 255, 0.2);
    border: 1px solid rgba(120, 180, 255, 0.4);
    font-size: 11px;
    font-weight: 800;
    color: #c8e0ff;
  }

  .ov-btn {
    display: inline-block;
    padding: 16px 42px;
    border: 2px solid #6a8eff;
    border-radius: 50px;
    background: linear-gradient(135deg, rgba(106, 142, 255, 0.25), rgba(120, 180, 255, 0.15));
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s ease;
    box-shadow: 0 0 30px rgba(106, 142, 255, 0.4);
  }

  .ov-btn:hover {
    background: linear-gradient(135deg, rgba(106, 142, 255, 0.5), rgba(120, 180, 255, 0.35));
    box-shadow: 0 0 50px rgba(106, 142, 255, 0.7);
    transform: translateY(-3px);
  }

  .ov-stats {
    display: flex;
    gap: 30px;
    margin-bottom: 25px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .ov-stat { text-align: center; }

  .ov-stat-val {
    font-size: 32px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 20px rgba(120, 180, 255, 0.6);
  }

  .ov-stat-lbl {
    font-size: 11px;
    color: #a0b0d0;
    letter-spacing: 2px;
    font-weight: 700;
    margin-top: 4px;
  }

  #pauseHint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 30px;
    padding: 8px 20px;
    font-size: 12px;
    color: #b0c0d8;
    letter-spacing: 1px;
    font-weight: 600;
    z-index: 10;
    pointer-events: none;
  }

  #pauseHint .ph-key {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(120, 180, 255, 0.2);
    color: #c8e0ff;
    font-weight: 800;
    margin: 0 3px;
  }

  #backBtn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 15;
    padding: 10px 18px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  #backBtn:hover {
    background: rgba(120, 180, 255, 0.25);
    border-color: rgba(120, 180, 255, 0.6);
    transform: translateY(-2px);
  }

  #mobileControls {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    display: none;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 12;
    pointer-events: none;
  }

  .mc-group {
    display: flex;
    gap: 12px;
    pointer-events: auto;
  }

  .mc-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.3);
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 24px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    font-family: inherit;
  }

  .mc-btn:active, .mc-btn.active {
    background: rgba(120, 180, 255, 0.5);
    transform: scale(0.9);
  }

  @media (max-width: 700px) {
    #hud { padding: 0 12px; top: 12px; }
    .hud-box { padding: 8px 12px; min-width: 80px; }
    .hud-value { font-size: 18px; }
    #pauseHint { display: none; }
    #mobileControls { display: flex; }
    #backBtn { padding: 8px 14px; font-size: 11px; }
  }
</style>
</head>
<body>

<div id="gameWrap">
  <canvas id="gameCanvas"></canvas>
</div>

<a href="index.html" id="backBtn">← Back</a>

<div id="hud">
  <div class="hud-box">
    <div class="hud-label">SCORE</div>
    <div class="hud-value" id="hudScore">0</div>
  </div>

  <div id="hudRight">
    <div class="hud-box">
      <div class="hud-label">BEST</div>
      <div class="hud-value" id="hudBest">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">SPEED</div>
      <div class="hud-value" id="hudSpeed">1x</div>
    </div>
  </div>
</div>

<div id="overlay">
  <span class="ov-badge" id="ovBadge">✦ CITY RUNNER ✦</span>
  <h1 class="ov-title" id="ovTitle">ENDLESS RUN</h1>
  <p class="ov-subtitle" id="ovSubtitle">
    Dodge the traffic, collect coins, and survive as long as you can. The city never stops.
  </p>

  <div class="ov-keys" id="ovKeys">
    <span class="key-chip"><span class="kc-key">A / ←</span> Left</span>
    <span class="key-chip"><span class="kc-key">D / →</span> Right</span>
    <span class="key-chip"><span class="kc-key">Space</span> Jump</span>
    <span class="key-chip"><span class="kc-key">S / ↓</span> Slide</span>
    <span class="key-chip"><span class="kc-key">P</span> Pause</span>
  </div>

  <div class="ov-stats" id="ovStats" style="display: none;">
    <div class="ov-stat">
      <div class="ov-stat-val" id="ovFinalScore">0</div>
      <div class="ov-stat-lbl">SCORE</div>
    </div>
    <div class="ov-stat">
      <div class="ov-stat-val" id="ovFinalBest">0</div>
      <div class="ov-stat-lbl">BEST</div>
    </div>
    <div class="ov-stat">
      <div class="ov-stat-val" id="ovFinalCoins">0</div>
      <div class="ov-stat-lbl">COINS</div>
    </div>
  </div>

  <button class="ov-btn" id="ovBtn">▶ START RUNNING</button>
</div>

<div id="pauseHint">
  Press <span class="ph-key">P</span> to pause / resume
</div>

<div id="mobileControls">
  <div class="mc-group">
    <button class="mc-btn" id="mcLeft">◀</button>
    <button class="mc-btn" id="mcRight">▶</button>
  </div>
  <div class="mc-group">
    <button class="mc-btn" id="mcSlide">▼</button>
    <button class="mc-btn" id="mcJump">▲</button>
  </div>
</div>

<script src="city-runner.js"></script>
</body>
</html>
