
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Perhaps, You Were My Dua</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5efe3;
      color: #39291f;
      font-family: Georgia, "Times New Roman", serif;
    }

    /* TOP NAVIGATION */
    .story-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      min-height: 76px;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      background: rgba(245, 239, 227, 0.96);
      border-bottom: 1px solid #d8c6ae;
      box-shadow: 0 3px 18px rgba(57, 41, 31, 0.06);
    }

    .story-brand {
      color: #4a3020;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-decoration: none;
    }

    .story-nav-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
    }

    .story-nav-links a {
      color: #624936;
      font-family: Arial, sans-serif;
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .story-nav-links a:hover {
      color: #9b7048;
    }

    /* MAIN BACKGROUND */
  
.story-page {
      position: relative;
      isolation: isolate;
      min-height: calc(100vh - 76px);
      padding: 60px 20px;
      background:
        radial-gradient(
          ellipse at 15% 10%,
          rgba(190, 160, 120, 0.17),
          transparent 45%
        ),
        radial-gradient(
          ellipse at 85% 80%,
          rgba(135, 100, 70, 0.10),
          transparent 42%
        ),
        #f5efe3;
    }


    .story-coming-soon {
      max-width: 900px;
      margin: 0 auto;
      padding: 70px 25px;
      text-align: center;
      border: 1px solid #d8c6ae;
      border-radius: 8px;
      background: rgba(255, 251, 244, 0.65);
    }


/* Cursor-following magical glow */
.story-page {
  --mouse-x: 50%;
  --mouse-y: 30%;
}

.story-page::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;

  background:
    radial-gradient(
      circle 190px at var(--mouse-x) var(--mouse-y),
      rgba(207, 161, 102, 0.30),
      rgba(207, 161, 102, 0.10) 45%,
      transparent 75%
    );

  transition: background 0.12s ease;
}

.story-page::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.7;

  background-image:
    radial-gradient(circle, #c49a63 1px, transparent 2px),
    radial-gradient(circle, #fff8e8 1.5px, transparent 2.5px),
    radial-gradient(circle, rgba(150, 105, 60, 0.65) 1px, transparent 2px);

  background-size: 83px 97px, 137px 149px, 191px 173px;
  background-position: 0 0, 35px 50px, 80px 20px;

  animation: floatingMagic 18s linear infinite;
}

.story-page > section {
  position: relative;
  z-index: 1;
}

@keyframes floatingMagic {
  from {
    background-position: 0 0, 35px 50px, 80px 20px;
  }
  to {
    background-position: 83px 194px, -102px 348px, 271px -153px;
  }
}

    .story-coming-soon p {
      color: #876b50;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .story-coming-soon h1 {
      margin: 20px 0;
      color: #4a3020;
      font-size: clamp(32px, 6vw, 56px);
      font-weight: normal;
      line-height: 1.2;
    }

    .story-coming-soon .story-subtitle {
      max-width: 560px;
      margin: 0 auto;
      color: #715b47;
      font-size: 16px;
      line-height: 1.9;
    }
    

.story-video {
  width: 100%;
  max-width: 520px;
  margin: 28px auto 0;
  overflow: hidden;
  border: 1px solid #cbb394;
  border-radius: 8px;
  background: #2f2119;
  box-shadow: 0 8px 22px rgba(57, 41, 31, 0.12);
}


.story-video video {
  display: block;
  width: 100%;
  height: 290px;
  object-fit: cover;
  object-position: center;
}




    @media (max-width: 650px) {
      .story-navbar {
        flex-direction: column;
        padding: 18px 14px;
        gap: 16px;
      }

      .story-nav-links {
        justify-content: center;
        gap: 16px;
      }

      .story-nav-links a {
        font-size: 11px;
      }

      .story-page {
        padding: 30px 14px;
      }

      .story-coming-soon {
        padding: 50px 18px;
      }
    }
  </style>
</head>

<body>

  <header class="story-navbar">
    <a class="story-brand" href="#storyHome">
      PERHAPS, YOU WERE MY DUA
    </a>

    <nav class="story-nav-links">
      <a href="#storyHome">Home</a>
      <a href="#storyIntroduction">The Story</a>
      <a href="#storyCharacters">Characters</a>
      <a href="#storyEpisodes">Episodes</a>
    </nav>
  </header>

  <main class="story-page" id="storyHome">

    <section class="story-coming-soon" id="storyIntroduction">
      <p>FAITH · FATE · LOVE</p>

      <h1>Perhaps, You Were My Dua</h1>

      <div class="story-subtitle">
        A story of hidden pain, unexpected encounters,
        friendship, and two hearts whose paths were yet to cross.
      </div>
      
      <div class="story-video">
        <video controls autoplay muted loop playsinline>
          <source src="images/images/anime.mp4" type="video/mp4">
          Your browser does not support this video.
        </video>
      </div>

    </section>

    <section id="storyCharacters"></section>
    <section id="storyEpisodes"></section>

  </main>

<script>
  const storyPage = document.querySelector(".story-page");

  if (storyPage) {
    storyPage.addEventListener("pointermove", function (event) {
      const rect = storyPage.getBoundingClientRect();

      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      storyPage.style.setProperty("--mouse-x", x + "px");
      storyPage.style.setProperty("--mouse-y", y + "px");
    });

    storyPage.addEventListener("pointerleave", function () {
      storyPage.style.setProperty("--mouse-x", "50%");
      storyPage.style.setProperty("--mouse-y", "30%");
    });
  }
</script>

</body>
</html>
