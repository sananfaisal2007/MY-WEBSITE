
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Perhaps, You Were My Dua</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5efe3;
      color: #39291f;
      font-family: Georgia, "Times New Roman", serif;
    }

    /* TOP NAVIGATION */
    .story-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      min-height: 76px;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      background: rgba(245, 239, 227, 0.96);
      border-bottom: 1px solid #d8c6ae;
      box-shadow: 0 3px 18px rgba(57, 41, 31, 0.06);
    }

    .story-brand {
      color: #4a3020;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-decoration: none;
    }

    .story-nav-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
    }

    .story-nav-links a {
      color: #624936;
      font-family: Arial, sans-serif;
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .story-nav-links a:hover {
      color: #9b7048;
    }

    /* MAIN BACKGROUND */
    .story-page {
      min-height: calc(100vh - 76px);
      padding: 60px 20px;
      background:
        radial-gradient(
          ellipse at 15% 10%,
          rgba(190, 160, 120, 0.17),
          transparent 45%
        ),
        radial-gradient(
          ellipse at 85% 80%,
          rgba(135, 100, 70, 0.10),
          transparent 42%
        ),
        #f5efe3;
    }

    .story-coming-soon {
      max-width: 900px;
      margin: 0 auto;
      padding: 70px 25px;
      text-align: center;
      border: 1px solid #d8c6ae;
      border-radius: 8px;
      background: rgba(255, 251, 244, 0.65);
    }

    .story-coming-soon p {
      color: #876b50;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .story-coming-soon h1 {
      margin: 20px 0;
      color: #4a3020;
      font-size: clamp(32px, 6vw, 56px);
      font-weight: normal;
      line-height: 1.2;
    }

    .story-coming-soon .story-subtitle {
      max-width: 560px;
      margin: 0 auto;
      color: #715b47;
      font-size: 16px;
      line-height: 1.9;
    }

    @media (max-width: 650px) {
      .story-navbar {
        flex-direction: column;
        padding: 18px 14px;
        gap: 16px;
      }

      .story-nav-links {
        justify-content: center;
        gap: 16px;
      }

      .story-nav-links a {
        font-size: 11px;
      }

      .story-page {
        padding: 30px 14px;
      }

      .story-coming-soon {
        padding: 50px 18px;
      }
    }
  </style>
</head>

<body>

  <header class="story-navbar">
    <a class="story-brand" href="#storyHome">
      PERHAPS, YOU WERE MY DUA
    </a>

    <nav class="story-nav-links">
      <a href="#storyHome">Home</a>
      <a href="#storyIntroduction">The Story</a>
      <a href="#storyCharacters">Characters</a>
      <a href="#storyEpisodes">Episodes</a>
    </nav>
  </header>

  <main class="story-page" id="storyHome">

    <section class="story-coming-soon" id="storyIntroduction">
      <p>FAITH · FATE · LOVE</p>

      <h1>Perhaps, You Were My Dua</h1>

      <div class="story-subtitle">
        A story of hidden pain, unexpected encounters,
        friendship, and two hearts whose paths were yet to cross.
      </div>
    </section>

    <section id="storyCharacters"></section>
    <section id="storyEpisodes"></section>

  </main>

</body>
</html>
