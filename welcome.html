<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome 🌌 | Sanan's World</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">

<style>
/* ═══════════════════════════════════════════════════════
   🌌 SOLAR SYSTEM WELCOME — FULL CSS
   ═══════════════════════════════════════════════════════ */

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02000a;
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    color: #fff;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

/* ═══════ WELCOME SCREEN ═══════ */
#welcome-screen {
    position: fixed;
    inset: 0;
    z-index: 99999;
    overflow: hidden;
    background: #02000a;
    transition: opacity 0.8s ease, transform 1s ease, filter 1s ease;
}

#welcome-screen.leaving {
    opacity: 0;
    transform: scale(1.4);
    filter: blur(12px);
    pointer-events: none;
}

/* ═══════ SPACE BACKGROUND ═══════ */
#space {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 20% 30%, rgba(80, 40, 140, 0.38), transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(140, 60, 180, 0.28), transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(40, 20, 90, 0.45), transparent 60%),
        radial-gradient(ellipse at 50% 0%, rgba(60, 30, 120, 0.32), transparent 60%),
        linear-gradient(180deg, #02000a 0%, #0a0420 50%, #02000a 100%);
    overflow: hidden;
}

/* Milky Way */
#milkyway {
    position: absolute;
    inset: -20%;
    background: linear-gradient(
        115deg,
        transparent 25%,
        rgba(150, 130, 255, 0.08) 38%,
        rgba(200, 160, 255, 0.16) 46%,
        rgba(255, 200, 240, 0.24) 50%,
        rgba(200, 160, 255, 0.16) 54%,
        rgba(150, 130, 255, 0.08) 62%,
        transparent 75%
    );
    filter: blur(28px);
    pointer-events: none;
    z-index: 1;
}

#milkyway::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(255, 220, 255, 0.15), transparent 40%);
    filter: blur(40px);
    animation: mwPulse 8s ease-in-out infinite;
}

@keyframes mwPulse {
    0%, 100% { opacity: 0.7; }
    50%      { opacity: 1; }
}

/* ═══════ STARFIELD CANVAS ═══════ */
#starCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
}

/* ═══════ ASTEROIDS ═══════ */
#asteroidsLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
}

.asteroid {
    position: absolute;
    background: radial-gradient(circle at 35% 35%,
        #9a8a78,
        #6a5a48 55%,
        #3a2a18 100%);
    border-radius: 48% 52% 55% 45% / 52% 48% 52% 48%;
    box-shadow:
        inset -2px -2px 6px rgba(0, 0, 0, 0.8),
        inset 2px 2px 5px rgba(200, 180, 150, 0.35),
        0 0 10px rgba(150, 130, 100, 0.45);
    animation: astDrift linear infinite;
    will-change: transform;
}

.asteroid::before {
    content: "";
    position: absolute;
    top: 22%;
    left: 18%;
    width: 28%;
    height: 28%;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.35);
    filter: blur(1.2px);
}

.asteroid::after {
    content: "";
    position: absolute;
    top: 55%;
    left: 58%;
    width: 18%;
    height: 18%;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.28);
    filter: blur(1.2px);
}

@keyframes astDrift {
    0%   { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(var(--ax), var(--ay)) rotate(720deg); }
}

/* ═══════ SOLAR SYSTEM ═══════ */
#solarSystem {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    z-index: 5;
    pointer-events: none;
}

.orbit-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    border: 1px solid rgba(180, 160, 255, 0.09);
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.orbit-ring::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    border: 1px dashed rgba(220, 200, 255, 0.05);
}

.planet-orbit {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50%;
    animation: orbit linear infinite;
    will-change: transform;
}

@keyframes orbit {
    to { transform: rotate(360deg); }
}

/* ═══════ PLANETS ═══════ */
.planet {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    cursor: pointer;
    transition: filter 0.35s ease, transform 0.35s ease;
    will-change: filter, transform;
}

.planet:hover {
    filter: brightness(1.5) drop-shadow(0 0 14px currentColor);
    transform: translate(-50%, -50%) scale(1.35);
    z-index: 100;
}

.planet-eye {
    position: absolute;
    width: 16%;
    height: 22%;
    background: #0a0812;
    border-radius: 50%;
    top: 38%;
    animation: planetBlink 5s ease-in-out infinite;
}

.planet-eye.left  { left: 26%; }
.planet-eye.right { right: 26%; animation-delay: 0.15s; }

.planet-eye::before {
    content: "";
    position: absolute;
    width: 42%;
    height: 42%;
    background: #fff;
    border-radius: 50%;
    top: 14%;
    left: 14%;
}

@keyframes planetBlink {
    0%, 44%, 56%, 100% { transform: scaleY(1); }
    50%                { transform: scaleY(0.08); }
}

.planet-smile {
    position: absolute;
    bottom: 20%;
    left: 50%;
    transform: translateX(-50%);
    width: 26%;
    height: 10%;
    border: 2px solid #0a0812;
    border-top: none;
    border-radius: 0 0 40px 40px;
    opacity: 0.9;
}

.saturn-rings {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 220%;
    height: 42%;
    border: 3px solid rgba(255, 220, 150, 0.75);
    border-radius: 50%;
    transform: translate(-50%, -50%) rotate(-18deg);
    box-shadow:
        0 0 10px rgba(255, 220, 150, 0.7),
        inset 0 0 10px rgba(255, 220, 150, 0.5);
    pointer-events: none;
}

.saturn-rings::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid rgba(255, 200, 120, 0.45);
}

/* ═══════ SUN ═══════ */
#sunWrap {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 6;
    pointer-events: none;
}

#sunGlow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 500px;
    height: 500px;
    margin: -250px 0 0 -250px;
    border-radius: 50%;
    background: radial-gradient(circle,
        rgba(255, 220, 100, 0.55) 0%,
        rgba(255, 180, 80, 0.3) 30%,
        rgba(255, 140, 60, 0.12) 55%,
        transparent 75%);
    filter: blur(24px);
    animation: sunPulse 4s ease-in-out infinite;
}

@keyframes sunPulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.12); opacity: 1; }
}

#sun {
    position: relative;
    width: 155px;
height: 155px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%,
        #fffbe0 0%,
        #ffe27a 22%,
        #ffb84d 55%,
        #ff8a1a 85%,
        #e0660a 100%);
    box-shadow:
        0 0 50px #ffe27a,
        0 0 100px rgba(255, 180, 80, 0.8),
        0 0 160px rgba(255, 140, 60, 0.55),
        inset 0 0 40px rgba(255, 255, 255, 0.55),
        inset -12px -12px 40px rgba(200, 80, 20, 0.4);
    animation: sunFloat 6s ease-in-out infinite;
}

#sun::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
        radial-gradient(circle at 25% 30%, rgba(255, 255, 255, 0.5), transparent 22%),
        radial-gradient(circle at 70% 45%, rgba(255, 200, 100, 0.6), transparent 26%),
        radial-gradient(circle at 55% 75%, rgba(255, 180, 80, 0.5), transparent 22%);
    animation: sunSpin 24s linear infinite;
}

@keyframes sunSpin { to { transform: rotate(360deg); } }

@keyframes sunFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-8px) scale(1.02); }
}

.sun-eye {
    position: absolute;
    width: 22px;
    height: 28px;
    background: #3a1a08;
    border-radius: 50%;
    top: 62px;
    animation: sunBlink 4s ease-in-out infinite;
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
}

.sun-eye.left  { left: 46px; }
.sun-eye.right { right: 46px; animation-delay: 0.15s; }

.sun-eye::before {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    background: #fff;
    border-radius: 50%;
    top: 4px;
    left: 4px;
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
}

.sun-eye::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 50%;
    bottom: 6px;
    right: 5px;
}

@keyframes sunBlink {
    0%, 42%, 58%, 100% { transform: scaleY(1); }
    50%                { transform: scaleY(0.08); }
}

.sun-mouth {
    position: absolute;
    bottom: 42px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 22px;
    border: 4px solid #3a1a08;
    border-top: none;
    border-radius: 0 0 50px 50px;
}

.sun-blush {
    position: absolute;
    width: 22px;
    height: 12px;
    background: rgba(255, 90, 80, 0.55);
    border-radius: 50%;
    top: 96px;
    filter: blur(4px);
}

.sun-blush.left  { left: 26px; }
.sun-blush.right { right: 26px; }

/* ═══════ SUN BUBBLE (talking) ═══════ */
#sunBubble {
    position: absolute;
    left: 50%;
    top: calc(50% - 115px);
    transform: translate(-50%, -100%) scale(0.9);
    background: linear-gradient(135deg, #fff8c0, #ffe27a);
    color: #4a2010;
    padding: 8px 13px;
    border-radius: 22px 22px 22px 6px;
   font-size: 12px;
    font-weight: 700;
    line-height: 1.5;
    max-width: 230px;
    text-align: center;
    box-shadow:
        0 10px 36px rgba(255, 200, 100, 0.55),
        0 0 0 3px rgba(255, 226, 122, 0.35);
    z-index: 30;
    pointer-events: none;
    opacity: 0;
    animation: bubbleFloat 3s ease-in-out infinite;
    transition: opacity 0.5s ease, transform 0.5s ease;
}

#sunBubble.show {
    opacity: 1;
    transform: translate(-50%, -100%) scale(1);
}

#sunBubble::after {
    content: "";
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-top: 16px solid #ffe27a;
    filter: drop-shadow(0 3px 4px rgba(255, 200, 100, 0.4));
}

@keyframes bubbleFloat {
    0%, 100% { margin-top: 0; }
    50%      { margin-top: -6px; }
}

/* ═══════ NAME INPUT ═══════ */
#nameBox {
    position: absolute;
    left: 50%;
    top: 63%;
    transform: translate(-50%, 0);
    z-index: 20;
    width: min(300px, 78vw);
    pointer-events: auto;
    opacity: 0;
    transition: opacity 0.8s ease 0.5s;
}

#nameBox.show { opacity: 1; }

#nameBox .name-hint {
    display: block;
    text-align: center;
    font-size: 11px;
    letter-spacing: 3px;
    color: #ffe27a;
    font-weight: 800;
    margin-bottom: 8px;
    text-shadow: 0 0 10px rgba(255, 226, 122, 0.6);
    animation: hintPulse 2.5s ease-in-out infinite;
}

@keyframes hintPulse {
    0%, 100% { opacity: 0.7; }
    50%      { opacity: 1; }
}

#nameWrap {
    position: relative;
    padding: 3px;
    border-radius: 50px;
    background: linear-gradient(90deg, #8b4dff, #ffc8f2, #ffe27a, #8b4dff);
    background-size: 300% 100%;
    animation: borderFlow 5s linear infinite;
    box-shadow:
        0 0 24px rgba(200, 130, 255, 0.55),
        0 0 50px rgba(255, 200, 242, 0.35);
    transition: box-shadow 0.3s ease;
}

#nameWrap.shake {
    animation: shake 0.5s;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-10px); }
    40%      { transform: translateX(10px); }
    60%      { transform: translateX(-6px); }
    80%      { transform: translateX(6px); }
}

@keyframes borderFlow { to { background-position: 300% 0; } }

#visitorName {
    display: block;
    width: 100%;
    padding: 13px 18px;
    border: none;
    outline: none;
    border-radius: 47px;
    background: rgba(12, 6, 26, 0.96);
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-align: center;
    text-shadow: 0 0 10px rgba(255, 200, 242, 0.6);
    caret-color: #ffc8f2;
}

#visitorName::placeholder {
    color: #8a7aa8;
    font-weight: 500;
    letter-spacing: 0.5px;
}

#enterBtn {
    display: block;
    margin: 22px auto 0;
    padding: 13px 32px;
    border: 2px solid #ffe27a;
    border-radius: 50px;
    background: linear-gradient(135deg,
        rgba(255, 226, 122, 0.18),
        rgba(255, 200, 242, 0.14),
        rgba(200, 130, 255, 0.18));
    color: #fff;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 3px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow:
        0 0 28px rgba(255, 226, 122, 0.5),
        0 0 60px rgba(200, 130, 255, 0.3),
        inset 0 0 20px rgba(255, 255, 255, 0.1);
    animation: btnPulse 3s ease-in-out infinite;
}

@keyframes btnPulse {
    0%, 100% {
        box-shadow:
            0 0 28px rgba(255, 226, 122, 0.5),
            0 0 60px rgba(200, 130, 255, 0.3),
            inset 0 0 20px rgba(255, 255, 255, 0.1);
    }
    50% {
        box-shadow:
            0 0 48px rgba(255, 226, 122, 0.85),
            0 0 100px rgba(200, 130, 255, 0.5),
            inset 0 0 30px rgba(255, 255, 255, 0.2);
    }
}

#enterBtn:hover:not(:disabled) {
    background: linear-gradient(135deg,
        rgba(255, 226, 122, 0.4),
        rgba(255, 200, 242, 0.3),
        rgba(200, 130, 255, 0.4));
    transform: translateY(-3px) scale(1.05);
}

#enterBtn:disabled {
    cursor: default;
    opacity: 0.9;
}

/* ═══════ LIVE NAME DISPLAY ═══════ */
#liveNameDisplay {
    position: fixed;
    left: 50%;
    top: 30%;
    transform: translate(-50%, -50%);
    z-index: 100000;
    pointer-events: none;
    font-size: clamp(34px, 7vw, 76px);
    font-weight: 900;
    letter-spacing: 3px;
    text-align: center;
    line-height: 1.1;
    opacity: 0;
    transition: opacity 0.4s ease;
    white-space: nowrap;
}

#liveNameDisplay.visible { opacity: 1; }

.live-letter {
    display: inline-block;
    background: linear-gradient(135deg, #ffffff, #ffc8f2, #c9a6ff, #ffe27a, #ffffff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation:
        letterDrop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
        letterFlow 3s linear infinite;
    filter: drop-shadow(0 0 20px rgba(255, 200, 242, 0.7))
            drop-shadow(0 0 40px rgba(200, 130, 255, 0.4));
}

@keyframes letterDrop {
    0% { opacity: 0; transform: translateY(-70px) scale(0.3) rotate(-25deg); }
    60% { opacity: 1; transform: translateY(8px) scale(1.15) rotate(5deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
}

@keyframes letterFlow { to { background-position: 300% 0; } }

/* ═══════ SPARKLE CANVAS ═══════ */
#typeSparkleCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 99999;
}

.type-particle {
    position: fixed;
    pointer-events: none;
    z-index: 100001;
    font-size: 20px;
    animation: typeParticleFly 1.2s ease-out forwards;
}

@keyframes typeParticleFly {
    0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(360deg); }
}

/* ═══════ TRANSMISSION OVERLAY ═══════ */
#transmission {
    position: fixed;
    inset: 0;
    z-index: 100005;
    pointer-events: none;
    opacity: 0;
    background:
        radial-gradient(circle at 50% 50%,
            rgba(255, 255, 255, 0.95) 0%,
            rgba(255, 226, 122, 0.85) 15%,
            rgba(200, 130, 255, 0.7) 35%,
            rgba(80, 30, 160, 0.55) 55%,
            rgba(10, 4, 26, 0.9) 100%);
}

#transmission.active {
    animation: transmissionBurst 1.8s cubic-bezier(0.6, 0, 0.3, 1) forwards;
}

@keyframes transmissionBurst {
    0%   { opacity: 0; transform: scale(0); }
    25%  { opacity: 1; transform: scale(2.5); }
    55%  { opacity: 1; transform: scale(6); }
    100% { opacity: 0; transform: scale(14); }
}

.fly-spark {
    position: fixed;
    font-size: 24px;
    pointer-events: none;
    z-index: 100006;
    filter: drop-shadow(0 0 12px rgba(255, 226, 122, 1));
    animation: flySpark 1.4s cubic-bezier(0.3, 0, 0.7, 1) forwards;
}

@keyframes flySpark {
    0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
    }
    70% { opacity: 1; }
    100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--fx)), calc(-50% + var(--fy)))
                   scale(2) rotate(720deg);
    }
}

/* ═══════ MOBILE ═══════ */
@media (max-width: 700px) {
    #sun { width: 110px; height: 110px; }
    .sun-eye { width: 16px; height: 20px; top: 40px; }
    .sun-eye.left  { left: 30px; }
    .sun-eye.right { right: 30px; }
    .sun-mouth { bottom: 28px; width: 30px; height: 15px; border-width: 3px; }
    .sun-blush { width: 16px; height: 9px; top: 62px; }
    .sun-blush.left  { left: 16px; }
    .sun-blush.right { right: 16px; }
    #sunGlow { width: 340px; height: 340px; margin: -170px 0 0 -170px; }

    #sunBubble {
        top: calc(50% - 160px);
        font-size: 11.5px;
        padding: 10px 16px;
        max-width: 260px;
    }

    #nameBox { top: 66%; width: min(260px, 82vw); }
    #visitorName { padding: 11px 14px; font-size: 13px; }
    #enterBtn { padding: 11px 24px; font-size: 11px; letter-spacing: 2px; }

    #liveNameDisplay {
        top: 24%;
        font-size: clamp(28px, 10vw, 56px);
        letter-spacing: 2px;
    }
}

@media (prefers-reduced-motion: reduce) {
    #sun, #sunGlow, .sun-eye, .planet-eye, #sunBubble,
    .asteroid, #milkyway::after, #enterBtn, .live-letter {
        animation: none !important;
    }
}

/* FIX: Keep the complete solar system visible */

#solarSystem {
    width: 0 !important;
    height: 0 !important;
    transform: scale(0.78);
    transform-origin: center center;
}


/* Make all planet orbits visible */
.orbit-ring {
    border-color: rgba(180, 160, 255, 0.35) !important;
    border-style: solid !important;
}

/* Keep planets visible above the orbit lines */
.planet-orbit {
    z-index: 10;
}

.planet {
    z-index: 11;
    opacity: 1 !important;
    visibility: visible !important;
}

</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════
     🌌 SOLAR SYSTEM WELCOME SCREEN
     ═══════════════════════════════════════════════════ -->
<div id="welcome-screen">

    <!-- Space background -->
    <div id="space">
        <div id="milkyway"></div>
    </div>

    <!-- Stars canvas (constellation cursor) -->
    <canvas id="starCanvas"></canvas>

    <!-- Asteroids -->
    <div id="asteroidsLayer"></div>

    <!-- Solar system (planets) -->
    <div id="solarSystem"></div>

    <!-- Sun -->
    <div id="sunWrap">
        <div id="sunGlow"></div>
        <div id="sun">
            <div class="sun-eye left"></div>
            <div class="sun-eye right"></div>
            <div class="sun-mouth"></div>
            <div class="sun-blush left"></div>
            <div class="sun-blush right"></div>
        </div>
    </div>

    <!-- Sun talking bubble -->
    <div id="sunBubble"></div>

    <!-- Name input box -->
    <div id="nameBox">
        <span class="name-hint">✦ APNA NAAM LIKHO ✦</span>
        <div id="nameWrap">
            <input id="visitorName" type="text" maxlength="20"
                   autocomplete="off" spellcheck="false"
                   placeholder="✨ Yahan likho...">
        </div>
        <button id="enterBtn" type="button">ENTER MY WORLD ✨</button>
    </div>

    <!-- Live name display -->
    <div id="liveNameDisplay" aria-hidden="true"></div>

    <!-- Sparkle canvas -->
    <canvas id="typeSparkleCanvas" aria-hidden="true"></canvas>

    <!-- Transmission overlay -->
    <div id="transmission"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   🌌 SOLAR SYSTEM WELCOME — JAVASCRIPT
   ═══════════════════════════════════════════════════════ */
(function () {
    "use strict";

    /* ─────────────────────────────────────────────
       1. SOLAR SYSTEM SCALING (responsive)
       ───────────────────────────────────────────── */
    var solarSystem = document.getElementById("solarSystem");

   /* No scaling — orbits already sized for screen */

    /* ─────────────────────────────────────────────
       2. PLANETS DATA (with personalities)
       ───────────────────────────────────────────── */
    var planetsData = [
        { name: "Mercury", size: 9,  color: "#b8a890", orbit: 95,  speed: 22, hasRing: false,
          line: "Main chhota hoon, lekin tez bhagta hoon! 🪨" },
        { name: "Venus",   size: 13, color: "#ffd18a", orbit: 130, speed: 28, hasRing: false,
          line: "Main sab se chamakta hoon... literally! 💛" },
        { name: "Earth",   size: 14, color: "#4a9eff", orbit: 168, speed: 34, hasRing: false,
          line: "Main ghar hoon sabka — Earth, yaad rakho! 🏡" },
        { name: "Mars",    size: 12, color: "#e85a4a", orbit: 205, speed: 40, hasRing: false,
          line: "Red Planet? Red attitude bhi 😎" },
        { name: "Jupiter", size: 26, color: "#d4a574", orbit: 258, speed: 48, hasRing: false,
          line: "Sab se bara hoon, sab se pyaara hoon 😌" },
        { name: "Saturn",  size: 22, color: "#e8d4a0", orbit: 312, speed: 56, hasRing: true,
          line: "Rings meri pehchaan hain 💍✨" },
        { name: "Uranus",  size: 17, color: "#8ad4e8", orbit: 362, speed: 64, hasRing: false,
          line: "Main thanda hoon, lekin cool hoon 💠" },
        { name: "Neptune", size: 16, color: "#4a7ae8", orbit: 408, speed: 72, hasRing: false,
          line: "Deep blue... deep feelings 🧊💙" },
        { name: "Pluto",   size: 8,  color: "#c8a090", orbit: 448, speed: 82, hasRing: false,
          line: "Main chhota hoon... lekin exist karta hoon 🥺" }
    ];

    /* Orbit rings */
    planetsData.forEach(function (p) {
        var ring = document.createElement("div");
        ring.className = "orbit-ring";
        ring.style.width = (p.orbit * 2) + "px";
        ring.style.height = (p.orbit * 2) + "px";
        solarSystem.appendChild(ring);
    });

    /* Planet elements */
    planetsData.forEach(function (p, idx) {
        var orbit = document.createElement("div");
        orbit.className = "planet-orbit";
        orbit.style.width = (p.orbit * 2) + "px";
        orbit.style.height = (p.orbit * 2) + "px";
        orbit.style.marginLeft = -p.orbit + "px";
        orbit.style.marginTop = -p.orbit + "px";
        orbit.style.animationDuration = p.speed + "s";
        orbit.style.animationDelay = (-idx * 3) + "s";

        var planet = document.createElement("div");
        planet.className = "planet";
        planet.style.width = p.size + "px";
        planet.style.height = p.size + "px";
        planet.style.color = p.color;
planet.style.background = p.color;
    planet.style.boxShadow =
            "0 0 " + (p.size * 1.2) + "px " + p.color +
            ", inset -3px -3px 8px rgba(0,0,0,0.5), inset 2px 2px 6px rgba(255,255,255,0.35)";
        planet.title = p.name;

        /* Eyes */
        var eyeL = document.createElement("div");
        eyeL.className = "planet-eye left";
        var eyeR = document.createElement("div");
        eyeR.className = "planet-eye right";
        planet.appendChild(eyeL);
        planet.appendChild(eyeR);

        /* Smile (only big planets) */
        if (p.size >= 12) {
            var smile = document.createElement("div");
            smile.className = "planet-smile";
            planet.appendChild(smile);
        }

        /* Saturn rings */
        if (p.hasRing) {
            var rings = document.createElement("div");
            rings.className = "saturn-rings";
            planet.appendChild(rings);
        }

        /* Position at orbit edge */
       
planet.style.left = (p.orbit * 2) + "px";
planet.style.top = (p.orbit * 2) + "px";


        /* Hover: planet speaks */
        planet.addEventListener("mouseenter", function () {
            setBubble(p.line, true);
        });

        planet.addEventListener("mouseleave", function () {
            setBubble(defaultSunLine, false);
        });

        /* Touch support */
        planet.addEventListener("touchstart", function (e) {
            e.preventDefault();
            setBubble(p.line, true);
        }, { passive: false });

        orbit.appendChild(planet);
        solarSystem.appendChild(orbit);
    });

    /* ─────────────────────────────────────────────
       3. ASTEROIDS
       ───────────────────────────────────────────── */
    var asteroidsLayer = document.getElementById("asteroidsLayer");
    var isSmall = window.innerWidth < 700;
    var astCount = isSmall ? 28 : 55;

    for (var ai = 0; ai < astCount; ai++) {
        (function () {
            var a = document.createElement("div");
            a.className = "asteroid";

            var size = 3 + Math.random() * 14;
            a.style.width = size + "px";
            a.style.height = size + "px";
            a.style.left = Math.random() * 100 + "%";
            a.style.top = Math.random() * 100 + "%";
            a.style.opacity = (0.3 + Math.random() * 0.55).toFixed(2);

            var angle = Math.random() * Math.PI * 2;
            var dist = 120 + Math.random() * 380;
            a.style.setProperty("--ax", (Math.cos(angle) * dist).toFixed(1) + "px");
            a.style.setProperty("--ay", (Math.sin(angle) * dist).toFixed(1) + "px");

            a.style.animationDuration = (30 + Math.random() * 50) + "s";
            a.style.animationDelay = (-Math.random() * 40) + "s";

            asteroidsLayer.appendChild(a);
        })();
    }

    /* ─────────────────────────────────────────────
       4. STARFIELD + CONSTELLATION CURSOR
       ───────────────────────────────────────────── */
    var canvas = document.getElementById("starCanvas");
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W, H;

    function resizeCanvas() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    /* Background stars */
    var stars = [];
    var starCount = isSmall ? 100 : 200;
    var starColors = [
        { r: 255, g: 255, b: 255 },
        { r: 213, g: 182, b: 255 },
        { r: 255, g: 200, b: 242 },
        { r: 255, g: 226, b: 122 },
        { r: 165, g: 243, b: 252 }
    ];

    for (var si = 0; si < starCount; si++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            vx: (Math.random() - 0.5) * 0.06,
            vy: (Math.random() - 0.5) * 0.06,
            r: 0.5 + Math.random() * 1.4,
            twk: Math.random() * Math.PI * 2,
            twkSpeed: 0.008 + Math.random() * 0.018,
            color: starColors[Math.floor(Math.random() * starColors.length)]
        });
    }

    /* Cursor trail */
    var mouse = { x: W / 2, y: H / 2 };
    var points = [];
    var maxPoints = 26;
    var mouseMoving = false;
    var mouseIdleTimer = null;

    window.addEventListener("pointermove", function (e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouseMoving = true;

        points.push({ x: e.clientX, y: e.clientY, life: 1 });
        if (points.length > maxPoints) points.shift();

        if (mouseIdleTimer) clearTimeout(mouseIdleTimer);
        mouseIdleTimer = setTimeout(function () {
            mouseMoving = false;
        }, 300);
    }, { passive: true });

    window.addEventListener("pointerleave", function () {
        mouseMoving = false;
    });

    /* Draw loop */
    function drawStars() {
        ctx.clearRect(0, 0, W, H);

        /* Background stars */
        for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            s.x += s.vx;
            s.y += s.vy;
            s.twk += s.twkSpeed;

            if (s.x < 0) s.x = W;
            if (s.x > W) s.x = 0;
            if (s.y < 0) s.y = H;
            if (s.y > H) s.y = 0;

            var twinkle = 0.55 + Math.sin(s.twk) * 0.45;
            var c = s.color;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r * (0.85 + twinkle * 0.35), 0, Math.PI * 2);
            ctx.fillStyle = "rgba(" + c.r + "," + c.g + "," + c.b + "," + (0.5 + twinkle * 0.5) + ")";
            ctx.shadowBlur = 6 + twinkle * 4;
            ctx.shadowColor = "rgba(" + c.r + "," + c.g + "," + c.b + ",0.85)";
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        /* Fade trail points */
        points.forEach(function (p) { p.life -= 0.02; });
        points = points.filter(function (p) { return p.life > 0; });

        /* Constellation lines (between trail points) */
        if (points.length > 1) {
            for (var k = 0; k < points.length - 1; k++) {
                var a = points[k];
                var b = points[k + 1];
                var alpha = ((a.life + b.life) / 2) * 0.75;
                if (alpha < 0.03) continue;

                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = "rgba(220, 190, 255," + alpha + ")";
                ctx.lineWidth = 1.3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = "rgba(190, 150, 255, 0.8)";
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        /* Constellation lines (cursor to nearby stars) */
        if (mouseMoving) {
            for (var m = 0; m < stars.length; m++) {
                var st = stars[m];
                var dx = st.x - mouse.x;
                var dy = st.y - mouse.y;
                var d = Math.sqrt(dx * dx + dy * dy);
                if (d < 150) {
                    ctx.beginPath();
                    ctx.moveTo(st.x, st.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.strokeStyle = "rgba(200, 170, 255," + ((1 - d / 150) * 0.4) + ")";
                    ctx.lineWidth = 0.9;
                    ctx.stroke();
                }
            }
        }

        /* Glowing trail points */
        points.forEach(function (p) {
            var r = 2.5 * p.life + 0.8;
            var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 5);
            g.addColorStop(0, "rgba(255, 240, 255," + p.life + ")");
            g.addColorStop(0.5, "rgba(220, 180, 255," + (p.life * 0.55) + ")");
            g.addColorStop(1, "rgba(180, 120, 255, 0)");

            ctx.beginPath();
            ctx.arc(p.x, p.y, r * 5, 0, Math.PI * 2);
            ctx.fillStyle = g;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 255, 255," + p.life + ")";
            ctx.shadowBlur = 14;
            ctx.shadowColor = "rgba(255, 220, 255, 0.95)";
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        requestAnimationFrame(drawStars);
    }
    drawStars();

    /* ─────────────────────────────────────────────
       5. HELPERS
       ───────────────────────────────────────────── */
    function lighten(hex) {
        return "#" + hex.replace("#", "").split("").map(function (c) {
            var v = parseInt(c, 16);
            return Math.min(15, v + 5).toString(16);
        }).join("");
    }
    function darken(hex) {
        return "#" + hex.replace("#", "").split("").map(function (c) {
            var v = parseInt(c, 16);
            return Math.max(0, v - 5).toString(16);
        }).join("");
    }

    /* ─────────────────────────────────────────────
       6. SUN BUBBLE
       ───────────────────────────────────────────── */
    var bubbleEl = document.getElementById("sunBubble");
    var defaultSunLine = "✨ Welcome traveler! Main Surya hoon — in sab ka dost. Apna naam batao, hum sab tumhara intezar kar rahe hain! 🌞";
    var bubbleTimer = null;
    var hoverLock = false;

    function setBubble(text, persist) {
        bubbleEl.textContent = text;
        bubbleEl.classList.add("show");

        if (bubbleTimer) clearTimeout(bubbleTimer);

        if (!persist) {
            bubbleTimer = setTimeout(function () {
                bubbleEl.classList.remove("show");
            }, 5200);
        }
    }

    setTimeout(function () {
        setBubble(defaultSunLine, false);
    }, 1000);

    /* "Planets talking about user" chatter */
    var chatterLines = [
        "Earth: Jupiter, dekh na — naya insaan aya hai! 👀",
        "Jupiter: Haan bhai, bilkul naya lag raha hai! 😄",
        "Mars: Arre, iska naam kya hoga? 🤔",
        "Venus: Kuch toh bahut pyaara sa lag raha hai! 💛",
        "Saturn: Rings toh sabse pyaari meri hain... par yeh bhi cute hai! 💍",
        "Uranus: Main thanda hoon, par dil se welcome kehta hoon! 💠",
        "Neptune: Deep feelings wala insaan lagta hai 🌊",
        "Pluto: Mujhe bhi dost banao na... 🥺",
        "Mercury: Main chhota hoon, par dekh raha hoon sab! 🪨",
        "Earth: Shhh... abhi apna naam likh raha hai! ✍️"
    ];

    var chatterIdx = 0;
    setInterval(function () {
        if (document.activeElement === visitorName) return;
        if (hoverLock) return;
        setBubble(chatterLines[chatterIdx], false);
        chatterIdx = (chatterIdx + 1) % chatterLines.length;
    }, 6500);

    /* Lock hover during planet hover */
    var allPlanets = solarSystem.querySelectorAll(".planet");
    allPlanets.forEach(function (pl) {
        pl.addEventListener("mouseenter", function () { hoverLock = true; });
        pl.addEventListener("mouseleave", function () { hoverLock = false; });
    });

    /* ─────────────────────────────────────────────
       7. NAME INPUT
       ───────────────────────────────────────────── */
    var visitorName = document.getElementById("visitorName");
    var liveNameDisplay = document.getElementById("liveNameDisplay");
    var nameWrap = document.getElementById("nameWrap");
    var nameBox = document.getElementById("nameBox");
    var sparkleCanvas = document.getElementById("typeSparkleCanvas");
    var sctx = sparkleCanvas.getContext("2d");

    function resizeSparkleCanvas() {
        sparkleCanvas.width = window.innerWidth * dpr;
        sparkleCanvas.height = window.innerHeight * dpr;
        sparkleCanvas.style.width = window.innerWidth + "px";
        sparkleCanvas.style.height = window.innerHeight + "px";
        sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeSparkleCanvas();
    window.addEventListener("resize", resizeSparkleCanvas);

    var sparkles = [];

    function spawnSparkles(x, y) {
        var colors = ["#ffffff", "#ffc8f2", "#c9a6ff", "#ffe27a", "#67e8f9"];
        for (var i = 0; i < 14; i++) {
            sparkles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 9,
                vy: (Math.random() - 0.5) * 9 - 2.5,
                size: 2 + Math.random() * 4,
                life: 1,
                decay: 0.02 + Math.random() * 0.022,
                color: colors[Math.floor(Math.random() * colors.length)],
                gravity: 0.16,
                glow: 9 + Math.random() * 9
            });
        }
    }

    function drawSparkles() {
        sctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        for (var i = sparkles.length - 1; i >= 0; i--) {
            var s = sparkles[i];
            s.x += s.vx;
            s.y += s.vy;
            s.vy += s.gravity;
            s.vx *= 0.98;
            s.life -= s.decay;

            if (s.life <= 0) {
                sparkles.splice(i, 1);
                continue;
            }

            sctx.save();
            sctx.globalAlpha = s.life;
            sctx.fillStyle = s.color;
            sctx.shadowBlur = s.glow;
            sctx.shadowColor = s.color;
            sctx.beginPath();
            sctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
            sctx.fill();
            sctx.restore();
        }
        requestAnimationFrame(drawSparkles);
    }
    drawSparkles();

    var emojis = ["✨", "💜", "⭐", "🌸", "💫", "🦋", "🌟", "💖", "🎀", "🪐", "🌙", "☀️"];

    function popEmoji(x, y) {
        var span = document.createElement("span");
        span.className = "type-particle";
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        span.style.left = x + "px";
        span.style.top = y + "px";
        span.style.fontSize = (16 + Math.random() * 16) + "px";
        span.style.setProperty("--tx", ((Math.random() - 0.5) * 220) + "px");
        span.style.setProperty("--ty", (-80 - Math.random() * 140) + "px");
        span.addEventListener("animationend", function () { this.remove(); });
        document.body.appendChild(span);
    }

    function updateLiveName(name) {
        liveNameDisplay.textContent = "";
        if (!name) {
            liveNameDisplay.classList.remove("visible");
            return;
        }
        liveNameDisplay.classList.add("visible");
        for (var i = 0; i < name.length; i++) {
            var letter = document.createElement("span");
            letter.className = "live-letter";
            letter.textContent = name[i] === " " ? "\u00A0" : name[i];
            letter.style.animationDelay = (i * 0.04) + "s";
            liveNameDisplay.appendChild(letter);
        }
    }

    var lastLen = 0;
    visitorName.addEventListener("input", function () {
        var val = visitorName.value;
        var len = val.length;

        updateLiveName(val);

        if (len > lastLen) {
            var rect = visitorName.getBoundingClientRect();
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;
            spawnSparkles(cx, cy);
            popEmoji(cx, cy);
        }
        lastLen = len;

        /* Sun reacts */
        if (len > 0) {
            setBubble(val.trim() ? "Wah, " + val.trim() + "! Kya pyaara naam hai! 💫" : "✨ Apna naam likho traveler...", false);
        }
    });

    /* Auto focus */
    setTimeout(function () { visitorName.focus(); }, 800);

    /* ─────────────────────────────────────────────
       8. ENTER BUTTON — CINEMATIC TRANSMISSION
       ───────────────────────────────────────────── */
    var enterBtn = document.getElementById("enterBtn");
    var transmission = document.getElementById("transmission");
    var welcomeScreen = document.getElementById("welcome-screen");

    enterBtn.addEventListener("click", function () {
        var name = visitorName.value.trim();

        if (!name) {
            nameWrap.classList.remove("shake");
            void nameWrap.offsetWidth;
            nameWrap.classList.add("shake");
            setBubble("⚠️ Arre! Naam ke bina cosmos mein entry nahi milti! 😄", false);
            visitorName.focus();
            return;
        }

        /* Save name */
        try {
            sessionStorage.setItem("visitorName", name);
            sessionStorage.setItem("welcomeDone", "1");
        } catch (e) {}

        /* Final bubble */
        setBubble("✨ Welcome " + name + "! Chalo apni duniya dekhte hain! 💜", true);

        enterBtn.disabled = true;
        enterBtn.textContent = "TRANSMITTING... ✦";

        /* Sparkle burst from sun */
        var rect = document.getElementById("sunWrap").getBoundingClientRect();
        var sx = rect.left + rect.width / 2;
        var sy = rect.top + rect.height / 2;

        for (var i = 0; i < 45; i++) {
            (function (idx) {
                setTimeout(function () {
                    var sp = document.createElement("span");
                    sp.className = "fly-spark";
                    sp.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    sp.style.left = sx + "px";
                    sp.style.top = sy + "px";
                    sp.style.fontSize = (16 + Math.random() * 22) + "px";

                    var angle = Math.random() * Math.PI * 2;
                    var dist = 200 + Math.random() * 500;
                    sp.style.setProperty("--fx", (Math.cos(angle) * dist) + "px");
                    sp.style.setProperty("--fy", (Math.sin(angle) * dist) + "px");

                    document.body.appendChild(sp);
                    sp.addEventListener("animationend", function () { this.remove(); });
                }, idx * 12);
            })(i);
        }

        /* Transmission overlay */
        setTimeout(function () {
            transmission.classList.add("active");
            welcomeScreen.classList.add("leaving");
        }, 400);

        /* Redirect to main page */
        setTimeout(function () {
            window.location.href = "index.html";
        }, 2100);
    });

    /* Enter key on input */
    visitorName.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            enterBtn.click();
        }
    });

    /* Show name box after intro */
    setTimeout(function () {
        nameBox.classList.add("show");
    }, 1400);

})();
</script>
</body>
</html>
